services:
  app:
    build: .
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy
  reverb:
    build: .
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]
    volumes: [".:/app"]
    restart: unless-stopped
  worker:
    build: .
    command: php artisan queue:work database --queue=payments,realtime --sleep=1 --tries=3 --timeout=60
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    build: .
    command: php artisan schedule:work
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: local-development-only
    volumes: ["postgres:/var/lib/postgresql/data", "./docker/init.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 5s
      retries: 10
volumes:
  postgres:
